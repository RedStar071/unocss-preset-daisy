name: PR Labeler

on:
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize

permissions: {}

jobs:
    label:
        name: Label
        runs-on: ubuntu-latest
        if: github.repository == 'RedStar071/unocss-preset-daisy'
        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Label pull request
              uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  sync-labels: true
