name: release

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    CI: true

permissions: {}

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: 🚀 Create Release PR or Publish
        runs-on: ubuntu-latest
        timeout-minutes: 20
        if: github.repository_owner == 'RedStar071'
        permissions:
            contents: write
            pull-requests: write
            id-token: write

        steps:
            - name: Checkout Project
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Setup Node.js v24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org/

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Process Changesets
              uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
              with:
                  github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  publish-script: pnpm run publish
                  pr-title: 'chore: update changelog and release'
                  commit-message: 'chore: update changelog and release'
              env:
                  # `@changesets/changelog-github` needs a token to resolve PR/commit authors
                  GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  # Must match the repo secret name documented in .changeset/README.md
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
